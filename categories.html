<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки товаров</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background-color: #eee;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-price {
            color: #e44d26;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="products-grid">
        <!-- Карточка товара 1 -->
        <div class="product-card">
            <div class="product-image">Изображение товара</div>
            <div class="product-title">Название товара 1</div>
            <div class="product-price">1 999 ₽</div>
            <button class="buy-button">Купить</button>
        </div>

        <!-- Карточка товара 2 -->
        <div class="product-card">
            <div class="product-image">Изображение товара</div>
            <div class="product-title">Название товара 2</div>
            <div class="product-price">2 499 ₽</div>
            <button class="buy-button">Купить</button>
        </div>

        <!-- Карточка товара 3 -->
        <div class="product-card">
            <div class="product-image">Изображение товара</div>
            <div class="product-title">Название товара 3</div>
            <div class="product-price">3 199 ₽</div>
            <button class="buy-button">Купить</button>
        </div>

        <!-- Карточка товара 4 -->
        <div class="product-card">
            <div class="product-image">Изображение товара</div>
            <div class="product-title">Название товара 4</div>
            <div class="product-price">899 ₽</div>
            <button class="buy-button">Купить</button>
        </div>
    </div>
</body>
</html>
